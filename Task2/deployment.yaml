# Тестовое приложение для проверки динамического масштабирования.
# Стартуем с одной реплики, дальше количеством управляет HPA (см. hpa.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            # HPA считает утилизацию памяти от requests, а не от limits.
            # Лимит 30Mi по условию задания, request подобран так, чтобы
            # в простое приложение сидело ниже целевых 80%, а под нагрузкой
            # выходило за них.
            requests:
              cpu: 50m
              memory: 10Mi
            limits:
              memory: 30Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
